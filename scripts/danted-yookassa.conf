# /etc/danted.conf на домашнем сервере. SOCKS5 для бота, см. docs/yookassa-proxy.md:
# слушает только ipip, пускает только сервер бота и только к кассе.
logoutput: syslog
internal: 10.255.30.1 port = 1081
external.rotation: route
external: lo
clientmethod: none
socksmethod: none
user.privileged: root
user.unprivileged: nobody
client pass { from: 10.255.30.2/32 to: 10.255.30.1/32 }
client block { from: 0.0.0.0/0 to: 0.0.0.0/0 }
socks pass { from: 10.255.30.2/32 to: api.yookassa.ru port = 443 command: connect }
socks block { from: 0.0.0.0/0 to: 0.0.0.0/0 }
